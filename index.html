<!DOCTYPE html>ㄅ
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            width: 200px;
            height: 120px;
            margin: 50px auto;
            background: #f5f5f5;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.8s cubic-bezier(.4,2.08,.55,.44);
        }
        .rotate {
            transform: rotateY(360deg);
        }
    </style>
</head>
<body>
    <h1>hello World!!</h1>
    <div class="card" id="myCard">點我旋轉</div>
    <script>
        const card = document.getElementById('myCard');
        card.addEventListener('click', function() {
            card.classList.toggle('rotate');
        });
    </script>
</body>
</html>
